version: '3.8'

services:
  detector:
    build: .
    ports:
      - "8000:8000"
    environment:
      - LOG_FILE_PATH=sample_system.log
      - ERROR_THRESHOLD=0.3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.47.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "3000:3000"
    restart: unless-stopped
