services:
  # The Python AIOps Anomaly Detector Microservice
  log-detector:
    build: .
    container_name: log_anomaly_detector
    command: python -u exporter.py
    ports:
      - "8000:8000"
    volumes:
      - ./sample_system.log:/app/sample_system.log
    restart: unless-stopped

  # Prometheus Service for scraping and storing metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus_service
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  # Grafana Dashboard for visualizing metrics
  grafana:
    image: grafana/grafana:latest
    container_name: grafana_dashboard
    ports:
      - "3000:3000"
    restart: unless-stopped
